[package]
name = "d1-analytics"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# Populate only from the approved dependency table in delta-one/CLAUDE.md.
# The ONE dependency this crate is allowed: d1-core's id newtypes (BookId) so
# TrackerRecord never carries a bare u32 across the module boundary.
d1-core = { path = "../d1-core" }

[dev-dependencies]
# Mandatory property tests for this crate's overflow-guarded math (matches
# d1-core's dev-dependency pattern).
proptest = "1"
