[package]
name = "d1"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# Populate only from the approved dependency table in delta-one/CLAUDE.md.
d1-core = { path = "../d1-core" }
d1-gateway-fix = { path = "../d1-gateway-fix" }
d1-gateway-nats = { path = "../d1-gateway-nats" }
d1-refdata = { path = "../d1-refdata" }
d1-netting = { path = "../d1-netting" }
d1-posttrade = { path = "../d1-posttrade" }
rtrb = "0.3"
anyhow = "1"
ctrlc = "3"

[dev-dependencies]
# src/posttrade.rs's #[cfg(test)] mod is the only remaining user (sample
# CrossRecord fixtures) -- cycle.rs's production code mints ids via
# d1_posttrade::Stamper, never this crate directly.
uuid = { version = "1", features = ["v7"] }
# nats_round_trip.rs drives the gateway from the outside (publish a
# TargetPosition as EXO would, subscribe ExecutionReport as UI/EXO would).
async-nats = { version = "0.49", default-features = false }
tokio = { version = "1", features = ["rt", "time"] }
futures-util = "0.3"
prost = "0.14"
# netting_conservation.rs: mandatory Sigma-book-position proptest (P1.M3 Slice 2).
proptest = "1"
# golden_posttrade.rs: consumes the real Kafka topics d1-posttrade produces
# to, decodes Avro against protocol/avro/*.avsc, diffs vs. sim/golden/ as
# JSON. Same rdkafka feature set as d1-posttrade's own producer dependency.
apache-avro = "0.21"
serde_json = "1"
rdkafka = { version = "0.39", default-features = false, features = ["cmake-build"] }
