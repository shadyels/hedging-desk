# EXO service configuration (single source; no env-var spelunking — exo/CLAUDE.md).
[bus]
nats_url = "nats://localhost:4222"

[valuation]
revaluation_interval_s = 5
default_n_paths = 200_000
seed_manifest = "run-manifests/"   # seeds come from manifests, never from time

[models]
scheme = "qe"              # discretization scheme; set by docs/studies/p2m1-scheme-convergence.md
n_steps_per_year = 252
antithetic = true

# Illustrative and UNCALIBRATED (ADR-006 Amendment 4 s1). Not market data. EXO is the sole
# consumer of these Heston parameters -- they do NOT belong in protocol/refdata/universe.json,
# which would lend uncalibrated numbers the shared authority real instrument conventions carry.
# Underlyings: AAPL (1001), MSFT (1002), NESN (1003, CHF), SPX (2001), EURUSD (4001) -- see
# universe.json.

# Feller-VIOLATING (2*kappa*theta/xi**2 = 2*1.50*0.0400/0.60**2 = 0.333 < 1): variance can
# (in the continuous-time limit) reach zero. This is the regime QE and full-truncation Euler
# actually behave differently in, so it is the regime the scheme chosen by the convergence
# study must be shown to survive -- see docs/studies/p2m1-scheme-convergence.md.
[models.AAPL]
s0 = 187.50
r = 0.0425
q = 0.0050
v0 = 0.0400
kappa = 1.50
theta = 0.0400
xi = 0.60
rho = -0.70

# Feller-SATISFYING (2*2.00*0.0500/0.35**2 = 1.633 >= 1): variance stays away from zero in the
# continuous-time limit -- the regime where QE and Euler are expected to agree closely.
[models.MSFT]
s0 = 420.00
r = 0.0425
q = 0.0080
v0 = 0.0500
kappa = 2.00
theta = 0.0500
xi = 0.35
rho = -0.55

# NESN is CHF-denominated (universe.json instrument_id 1003): a near-zero short rate and a
# meaningfully positive dividend yield are plausible for a CHF blue chip, unlike a copy-pasted
# USD block. Feller-SATISFYING (2*1.80*0.0300/0.28**2 = 1.378 >= 1).
[models.NESN]
s0 = 88.00
r = 0.0050
q = 0.0280
v0 = 0.0300
kappa = 1.80
theta = 0.0300
xi = 0.28
rho = -0.45

# SPX index: stronger leverage effect (more negative rho) than single names is typical.
# Feller-VIOLATING (2*1.00*0.0350/0.55**2 = 0.231 < 1) -- the second violating set, deliberately,
# so the convergence study's Feller-violating parameter set is not AAPL-only.
[models.SPX]
s0 = 5500.00
r = 0.0425
q = 0.0130
v0 = 0.0350
kappa = 1.00
theta = 0.0350
xi = 0.55
rho = -0.75

# EURUSD (universe.json instrument_id 4001, FX_SPOT, quoted USD per EUR). FX under Heston rides the
# EQUITY parameter type with a documented alias (ADR-006 Amendment 8 s1): r := r_d, the DOMESTIC (USD,
# quote ccy) rate, which both drives and DISCOUNTS; q := r_f, the FOREIGN (EUR, base ccy) rate. The
# spot drift r - q = r_d - r_f is Garman-Kohlhagen's. Rates are continuously compounded, flat.
# ILLUSTRATIVE AND UNCALIBRATED (ADR-006 Amendment 4 s1): NOT fitted to any EURUSD smile (no risk
# reversal / butterfly / ATM term structure was used). TARF/PTARF prices under this set demonstrate
# mechanics and hedging behaviour only. Calibration caveat stands until P4.M4 calibrates Heston(-LV)
# to SIM-GENERATED synthetic surfaces; live-market calibration is Phase 5.
# Feller-VIOLATING (2*1.50*0.0081/0.25**2 = 0.389 < 1), inside the envelope QE was validated over
# (0.333 in ADR-006 A4 s4, 0.231 by G-W1). G-T5 compares the Heston CF price with Monte Carlo at
# FX vol, at T=1/12 and T=1, within a 3-SE band on a single seed per gate.
[models.EURUSD]
s0 = 1.0800
r = 0.0425     # r_d, USD (same USD rate as the equity sets)
q = 0.0200     # r_f, EUR
v0 = 0.0081    # 9% instantaneous vol
kappa = 1.50
theta = 0.0081
xi = 0.25
rho = -0.20

[rehedge]
# no-trade band half-widths, per instrument class, in delta units (qty_e2)
band_equity_qty_e2 = 50_000
band_fx_qty_e2 = 1_000_000

[greeks]
bump_spot_rel = 0.001
bump_vol_abs = 0.005
max_rel_std_error = 0.02   # Greeks above this SE are published flagged, never silently

[hedger]                 # Tier-2 optimizer (ADR-009); desk-visible, never hardcoded
risk_weight_vega = 1.0   # diag(Lambda)
risk_weight_gamma = 0.5
cost_aversion_lambda = 0.1
max_contracts_per_option_e2 = 500_000   # per-instrument liquidity cap
proposal_validity_s = 120

[rho_transfer]
usd_bucket_threshold_e9 = 8_000_000_000_000   # transfer trigger, below the Tier-1 warn level in d1.toml
