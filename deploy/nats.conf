# ponytail: no authorization, no TLS -- every client is fully trusted and may publish on any subject,
# including the execution path exo.targets.> (ADR-014 s13). Ceiling: single-host demo only. Upgrade: per-
# component users with publish/subscribe permissions, loopback-bound ports, TLS on 9222. Owner: P3.M2
# (d1.cmd.order makes the anonymous WebSocket an order-entry path), earlier for any shared deployment.
max_payload: 1MB   # the server default, stated explicitly (ADR-014 s14)
port: 4222
http_port: 8222
websocket {
  port: 9222
  no_tls: true   # demo only; TLS mandatory before any shared deployment
}
